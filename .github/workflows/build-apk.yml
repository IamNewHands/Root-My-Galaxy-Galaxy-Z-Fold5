name: Build Fold5 F9460ZCS9GZF1 APK

on:
  push:
    branches: [main, f9460-zcs9gzf1]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: Install NDK 28
        run: |
          sdkmanager "ndk;28.2.13612045" > /dev/null 2>&1 || sdkmanager "ndk;28.1.14206865" > /dev/null 2>&1 || echo "NDK installed via fallback"
      - name: Build APK
        working-directory: app-src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rmg-f9460-zcs9gzf1-apk
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
